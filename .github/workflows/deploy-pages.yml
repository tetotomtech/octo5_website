name: Deploy Octo5 website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          rm -rf site
          mkdir site
          unzip -q Octo.co.zip -d site
          cd site/Octo.co
          mv Index.html index.html
          mv assets/Logo assets/logo
          sed -i 's#assets/images/about-property.jpg#assets/images/project-01.jpg#g' index.html
          sed -i 's#assets/images/cta-background.jpg#assets/images/project-03.jpg#g' index.html
          sed -i 's#js/script.js#js/Js_script.js#g' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/Octo.co

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
